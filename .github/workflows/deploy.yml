name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Gates the deploy: a broken bundle should never reach GitHub Pages.
  # Nothing ran these before, so typecheck and lint had drifted into failing.
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: src/MomsLifesaver/package-lock.json

      - name: Install dependencies
        working-directory: src/MomsLifesaver
        run: npm ci

      - name: Typecheck
        working-directory: src/MomsLifesaver
        run: npm run typecheck

      - name: Lint
        working-directory: src/MomsLifesaver
        run: npm run lint

      - name: Test with coverage thresholds
        working-directory: src/MomsLifesaver
        run: npm run test:coverage

  build-and-deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: src/MomsLifesaver/package-lock.json

      - name: Install dependencies
        working-directory: src/MomsLifesaver
        run: npm ci

      - name: Build web app
        working-directory: src/MomsLifesaver
        run: npx expo export -p web --output-dir dist

      - name: Disable Jekyll processing
        run: touch src/MomsLifesaver/dist/.nojekyll

      - name: Add SPA fallback
        run: cp src/MomsLifesaver/dist/index.html src/MomsLifesaver/dist/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: src/MomsLifesaver/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
